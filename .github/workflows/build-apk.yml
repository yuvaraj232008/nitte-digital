name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the APK
        run: gradle assembleDebug
      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NitteDigital.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NitteDigital-apk
          path: NitteDigital.apk
      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nitte Digital build ${{ github.run_number }}
          files: NitteDigital.apk
